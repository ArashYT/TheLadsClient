plugins { id 'net.fabricmc.fabric-loom-remap' }
base { archivesName = 'ladsbench-mc1.20.1' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
loom { mixin { useLegacyMixinAp = true } }
sourceSets.main.java.srcDir '../common'
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
}
