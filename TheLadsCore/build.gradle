plugins {
    id 'base'
    id 'jvm-toolchains' // javaToolchains for build189
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

allprojects {
    group = project.findProperty('maven_group') ?: 'com.thelads.core'
    version = project.findProperty('mod_version') ?: '1.0.0'

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.fabricmc.net/' }
    }
}

// Minecraft 1.8.9 (Forge): v1_8_9 is a separate build with its own Gradle 8.8 wrapper, because Essential Loom fails on
// Gradle 9 (spike S1). Gradle 8.8 cannot run on Java 25, so it gets the Java 21 toolchain; it provisions its own Java 8.
def v189 = file('v1_8_9')
def build189 = tasks.register('build189', Exec) {
    group = 'build'
    description = 'Build the Minecraft 1.8.9 (Forge) Core jar with the v1_8_9 build.'
    dependsOn ':common:jar'
    def java21 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir v189
    commandLine new File(v189, System.getProperty('os.name').toLowerCase().contains('win') ? 'gradlew.bat' : 'gradlew').absolutePath
    doFirst {
        environment 'JAVA_HOME', java21.get().metadata.installationPath.asFile.absolutePath
        args 'build', '--console=plain',
            "-PcommonJar=${project(':common').tasks.named('jar').get().archiveFile.get().asFile.absolutePath}"
    }
}

tasks.register('buildAll') {
    dependsOn ':common:build', ':v1_21_11:build', ':v26_2:build', ':v26_3:build', build189
    doLast {
        println "Successfully built all TheLadsCore multi-version artifacts."
    }
}

tasks.named('build') {
    dependsOn 'buildAll'
}

// Package only production jars, isolated by game version. The launcher installs them.
tasks.register('deploy', Copy) {
    group = 'distribution'
    description = 'Stage production Core jars in the launcher game-mods packages.'
    dependsOn ':v1_21_11:remapJar', ':v26_2:jar', ':v26_3:jar', build189
    into layout.projectDirectory.dir('../TheLadsLauncher/game-mods')
    from(new File(v189, "build/libs/theladscore-${version}.jar")) {
        into '1.8.9'
        rename { 'theladscore.jar' }
    }
    from(providers.provider {
        project(':v1_21_11').tasks.named('remapJar').get().archiveFile.get()
    }) {
        into '1.21.11'
        rename { 'theladscore.jar' }
    }
    from(providers.provider {
        project(':v26_2').tasks.named('jar').get().archiveFile.get()
    }) {
        into '26.2'
        rename { 'theladscore.jar' }
    }
    from(providers.provider { project(':v26_3').tasks.named('jar').get().archiveFile.get() }) {
        into '26.3'
        rename { 'theladscore.jar' }
    }
}
