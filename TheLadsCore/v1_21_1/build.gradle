plugins {
    id 'fabric-loom'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom { accessWidenerPath = file('src/main/resources/theladscore.accesswidener') }

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    implementation "net.fabricmc:fabric-loader:0.16.9"
    // The version the 1.21.1 launcher pack ships (game-mods/1.21.1/client-mods.json).
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
    compileOnly "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
    // Bundled by Fabric Loader 0.16.9+ at runtime (@WrapMethod needs MixinExtras 0.4).
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.4.1'

    implementation project(':common')
    // Common classes are merged below. Bundle the Discord binding and its native runtime;
    // Minecraft supplies JNA, Gson and SLF4J. Loom include dependencies are non-transitive.
    include 'club.minnced:java-discord-rpc:2.0.1'
    include 'club.minnced:discord-rpc-release:v3.3.0'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    archiveClassifier = "mc1.21.1"
    from(project(':common').sourceSets.main.output)
}

// Embedded Entity Texture/Model Features (LGPL-3.0-only): upstream's compile-only APIs, and the modified sources in the jar.
repositories {
    maven { url 'https://repo.redlance.org/public'; content { includeGroup 'com.zigythebird.playeranim' } }
}
dependencies {
    compileOnly 'com.demonwav.mcdev:annotations:2.1.0'
    modCompileOnly('maven.modrinth:sodium:u1OEbNKx') { transitive = false }
    modCompileOnly('maven.modrinth:iris:zsoi0dso') { transitive = false }
    modCompileOnly('maven.modrinth:immediatelyfast:giRXGeHH') { transitive = false }
    modCompileOnly('maven.modrinth:3dskinlayers:hRPGTUwZ') { transitive = false }
    compileOnly('com.zigythebird.playeranim:PlayerAnimationLibCommon:1.0.14+mc.1.21.1') { transitive = false }
    compileOnly('com.zigythebird.playeranim:PlayerAnimationLibCore:1.0.14+mc.1.21.1') { transitive = false }
}
processResources {
    from('src/main/java') { include 'com/thelads/core/v1_21_1/embedded/etf/**'; into 'META-INF/lads-sources/etf/v1_21_1' }
    from('src/main/java') { include 'com/thelads/core/v1_21_1/embedded/emf/**'; into 'META-INF/lads-sources/emf/v1_21_1' }
}

// Embedded LGPL mods (1.4.6): the complete modified sources ship in the jar beside their notices.
processResources {
    ['fastipping', 'immediatelyfast'].each { key ->
        from('src/main/java') {
            include "com/thelads/core/v1_21_1/embedded/${key}/**"
            into "META-INF/lads-sources/${key}/v1_21_1"
        }
        from("src/main/resources/theladscore.embedded.${key}.mixins.json") { into "META-INF/lads-sources/${key}/v1_21_1" }
    }
}

// Optimized Cushions Backport (embedded) mixes into Cushion-Backport's classes; remapping those mixin targets
// needs them on the classpath. Compile only: Cushion-Backport stays a separate pack mod.
repositories {
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    modCompileOnly 'maven.modrinth:cushions-backport:3XEQqHaZ' // cushionbackport 1.0.5 (Fabric)
}

// ImmediatelyFast (embedded) uses the Reflect library, bundled nested like upstream does.
dependencies {
    implementation 'net.lenni0451:Reflect:1.6.2'
    include 'net.lenni0451:Reflect:1.6.2'
}
// Compile-time stubs of Xaero's Minimap API for the ImmediatelyFast compat mixin; the real classes come from the pack.
jar { exclude 'xaero/**' }
