plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Loom 1.17 no longer runs the Mixin annotation processor by default. Without it no refmap is written, and every injector that names
// a method (@Inject, @Redirect, @Shadow ...) keeps its Mojang name, which a production (intermediary) Fabric or a Connector setup
// cannot find: with defaultRequire 0 those hooks were silently skipped. This is why mixins looked "on" but did nothing.
loom {
    // Access for the embedded upstream mods (ETF, EMF, ImmediatelyFast), merged from their own 1.20.1 access wideners.
    accessWidenerPath = file('src/main/resources/theladscore.v1_20_1.accesswidener')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1"

    implementation project(':common')
    implementation files('../v26_2/libs/catconfig-mc-26.2-0.2.1.jar', '../v26_2/libs/catconfig-0.3.0.jar')

    // Embedded Entity Texture/Model Features: the optional-mod APIs upstream's own 1.20.1 Fabric build compiles against
    // (Iris, Sodium, 3D Skin Layers; same Modrinth versions). Compile only, they stay optional mods.
    compileOnly 'com.demonwav.mcdev:annotations:2.1.0'
    modCompileOnly('maven.modrinth:iris:s5eFLITc') { transitive = false }
    modCompileOnly('maven.modrinth:sodium:ygf8cVZg') { transitive = false }
    modCompileOnly('maven.modrinth:3dskinlayers:aiPCdDJa') { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

apply from: 'perf.gradle'
apply from: 'embedded.gradle'

processResources {
    // 1.20.1's shader preprocessor cannot import from another namespace, so the shared upscale functions (common) also ship as
    // a vanilla-namespace include for the Better Resolution shader.
    from('../common/src/main/resources/assets/theladscore/shaders/include/world_upscale.glsl') {
        into 'assets/minecraft/shaders/include'
        rename { 'lads_world_upscale.glsl' }
    }
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from(project(':common').sourceSets.main.output)
}

remapJar {
    archiveClassifier = 'mc1.20.1'
}



