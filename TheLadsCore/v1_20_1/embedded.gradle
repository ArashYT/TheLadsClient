// Embedded upstream-derived mods (1.8.5 perf lane). Same licensing approach as the 26.x build: every embedded mod's complete
// modified sources ship in the jar under META-INF/lads-sources/<name>/v1_20_1, beside its NOTICE/LICENSE texts, which live
// in src/main/resources/META-INF/lads-sources/<name>/ and are packed by the normal resources task.
processResources {
    def embeddedRoot = file('src/main/java/com/thelads/core/v1_20_1/embedded')
    (embeddedRoot.listFiles() ?: new File[0]).findAll { it.isDirectory() }.each { dir ->
        from('src/main/java') {
            include "com/thelads/core/v1_20_1/embedded/${dir.name}/**"
            into "META-INF/lads-sources/${dir.name}/v1_20_1"
        }
    }
    // Mixin configs of embedded mods ride along as part of the sources.
    from('src/main/resources') {
        include 'theladscore.v1_20_1.embedded.*.mixins.json'
        into 'META-INF/lads-sources/mixin-configs'
    }
}
