plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('compileJava', JavaCompile) {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('compileTestJava', JavaCompile) {
    options.release = 21
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.1.0'
    api 'com.google.code.gson:gson:2.11.0'
    api 'org.slf4j:slf4j-api:2.0.16'
    // EnumValuesRewriter: each game supplies ASM at runtime (Fabric 9.x, LaunchWrapper 5.0.3).
    compileOnly 'org.ow2.asm:asm-tree:9.10.1'
    compileOnly 'org.ow2.asm:asm-analysis:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.10.1'
    // FileDialogs: every game ships JNA (3.4.0 with 1.8.9, 5.x with 1.20.1 and 26.x); only API all of them have is used.
    compileOnly 'net.java.dev.jna:jna:5.12.1'
    testImplementation 'net.java.dev.jna:jna:5.12.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    from('src/main/java') {
        include 'com/thelads/core/client/SignalLossPolicy.java'
        include 'com/thelads/core/modules/SignalLossModule.java'
        into 'assets/theladscore/sources/signalloss/common'
    }
    from('src/main/java') {
        include 'com/thelads/core/modules/TabListModule.java'
        include 'com/thelads/core/modules/PingViewModule.java'
        into 'META-INF/lads-sources/tabtweaks/common'
    }
    // LadsVersion reads the Core version from here on every game version.
    inputs.property 'version', project.version.toString()
    filesMatching('assets/theladscore/version.txt') { expand version: project.version }
}

tasks.register('exportLadsApiSchema', JavaExec) {
    group = 'ladsapi'
    description = 'Exports the LadsClientAPI schema JSON for the server jar'
    dependsOn 'compileJava', 'processResources'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.thelads.core.client.ladsapi.SchemaExport'
    args = [rootProject.file('../LadsClientAPI/common/src/main/resources/ladsapi-schema.json').absolutePath]
    systemProperty 'thelads.version', project.version.toString()
}

