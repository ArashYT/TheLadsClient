plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom { accessWidenerPath = file('src/main/resources/theladscore.accesswidener') }

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    // The version the 1.21.11 launcher pack ships (game-mods/1.21.11/client-mods.json).
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'

    implementation project(':common')
    // Common classes are merged below. Minecraft supplies JNA, Gson and SLF4J.
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from(project(':common').sourceSets.main.output)
}

remapJar {
    archiveClassifier = 'mc1.21.11'
}

// Embedded Entity Texture/Model Features (LGPL-3.0-only): upstream's compile-only APIs, and the modified sources in the jar.
repositories {
    maven { url 'https://repo.redlance.org/public'; content { includeGroup 'com.zigythebird.playeranim' } }
}
dependencies {
    compileOnly 'com.demonwav.mcdev:annotations:2.1.0'
    modCompileOnly('maven.modrinth:iris:l77DAK6U') { transitive = false }
    modCompileOnly('maven.modrinth:immediatelyfast:9JPEk4KN') { transitive = false }
    modCompileOnly('maven.modrinth:3dskinlayers:R1cL8Kvt') { transitive = false }
    compileOnly('com.zigythebird.playeranim:PlayerAnimationLibCommon:1.1.0+alpha.1+mc.1.21.9') { transitive = false }
    compileOnly('com.zigythebird.playeranim:PlayerAnimationLibCore:1.1.0+alpha.1+mc.1.21.9') { transitive = false }
}
processResources {
    from('src/main/java') { include 'com/thelads/core/v1_21_11/embedded/etf/**'; into 'META-INF/lads-sources/etf/v1_21_11' }
    from('src/main/java') { include 'com/thelads/core/v1_21_11/embedded/emf/**'; into 'META-INF/lads-sources/emf/v1_21_11' }
}

// Embedded LGPL mods (1.4.6): the complete modified sources ship in the jar beside their notices.
processResources {
    ['fastipping', 'immediatelyfast'].each { key ->
        from('src/main/java') {
            include "com/thelads/core/v1_21_11/embedded/${key}/**"
            into "META-INF/lads-sources/${key}/v1_21_11"
        }
        from("src/main/resources/theladscore.embedded.${key}.mixins.json") { into "META-INF/lads-sources/${key}/v1_21_11" }
    }
}

// Optimized Cushions Backport (embedded) mixes into Cushion-Backport's classes; remapping those mixin targets
// needs them on the classpath. Compile only: Cushion-Backport stays a separate pack mod.
repositories {
    exclusiveContent {
        forRepository { maven { url 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    modCompileOnly 'maven.modrinth:cushions-backport:ww2wBrI7' // cushionbackport 1.0.5 (Fabric)
}

// ImmediatelyFast (embedded) uses the Reflect library, bundled nested like upstream does.
dependencies {
    implementation 'net.lenni0451:Reflect:1.6.2'
    include 'net.lenni0451:Reflect:1.6.2'
}
// Compile-time stubs of Xaero's Minimap API for the ImmediatelyFast compat mixin; the real classes come from the pack.
jar { exclude 'xaero/**' }

// Embedded upstream mods (1.4.6): the modified LGPL/MPL sources ship in the jar.
processResources {
    from('src/main/java') {
        include 'com/thelads/core/v1_21_11/embedded/fixbookgui/**'
        into 'META-INF/lads-sources/fixbookgui/v1_21_11'
    }
    from('src/main/java') {
        include 'com/thelads/core/v1_21_11/embedded/hoveringhotbar/**'
        into 'META-INF/lads-sources/hoveringhotbar/v1_21_11'
    }
    from('src/main/java') {
        include 'com/thelads/core/v1_21_11/embedded/nbtac/**'
        into 'META-INF/lads-sources/nbtac/v1_21_11'
    }
    from('src/main/java') {
        include 'com/thelads/core/v1_21_11/embedded/capes/**'
        into 'META-INF/lads-sources/capes/v1_21_11'
    }
}
