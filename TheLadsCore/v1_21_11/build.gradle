plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom { accessWidenerPath = file('src/main/resources/theladscore.accesswidener') }

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
    // The version the 1.21.11 launcher pack ships (game-mods/1.21.11/client-mods.json).
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'

    implementation project(':common')
    // Common classes are merged below. Minecraft supplies JNA, Gson and SLF4J.
    include 'club.minnced:java-discord-rpc:2.0.1'
    include 'club.minnced:discord-rpc-release:v3.3.0'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    from(project(':common').sourceSets.main.output)
}

remapJar {
    archiveClassifier = 'mc1.21.11'
}

// Embedded LGPL mods (1.4.6): the complete modified sources ship in the jar beside their notices.
processResources {
    ['fastipping'].each { key ->
        from('src/main/java') {
            include "com/thelads/core/v1_21_11/embedded/${key}/**"
            into "META-INF/lads-sources/${key}/v1_21_11"
        }
        from("src/main/resources/theladscore.embedded.${key}.mixins.json") { into "META-INF/lads-sources/${key}/v1_21_11" }
    }
}
