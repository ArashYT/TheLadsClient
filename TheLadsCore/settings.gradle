pluginManagement {
  repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    gradlePluginPortal()
  }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
rootProject.name = 'TheLadsCore'
include 'common'
include 'v1_20_1'
include 'v1_21_11'
include 'v26_2'

include 'v26_3'
include 'forge_earlywindow' // the Lads early loading window for Forge 1.20.1 packs (lads-earlywindow.jar)
