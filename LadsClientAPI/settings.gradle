pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
rootProject.name = 'LadsClientAPI'

// One jar for every server (PLAN 6.1). common = no Minecraft deps; each platform compiles against its own API only.
include 'common'
include 'platform-paper'     // lane SRV-A
include 'platform-velocity'  // lane SRV-A
include 'platform-fabric'    // lane SRV-B (Fabric 26.3 server)
include 'platform-forge'     // lane SRV-B (Forge 1.20.1 server)
