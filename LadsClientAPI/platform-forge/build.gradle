plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    implementation project(':common')
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()

    compileOnly 'net.minecraftforge:forge:1.20.1-47.4.10:universal'
    compileOnly 'net.minecraftforge:fmlcore:1.20.1-47.4.10'
    compileOnly 'net.minecraftforge:fmlloader:1.20.1-47.4.10'
    compileOnly 'net.minecraftforge:javafmllanguage:1.20.1-47.4.10'
    compileOnly 'net.minecraftforge:eventbus:6.0.5'
    compileOnly 'org.apache.commons:commons-lang3:3.12.0'
    compileOnly 'com.mojang:authlib:4.0.43'
    compileOnly 'com.mojang:brigadier:1.0.18'
    compileOnly 'io.netty:netty-buffer:4.1.97.Final'

    testImplementation 'net.minecraftforge:forge:1.20.1-47.4.10:universal'
    testImplementation 'net.minecraftforge:eventbus:6.0.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
